# Mensagens de validação para produtos
produto.nome.obrigatorio=O nome do produto é obrigatório.
produto.nome.tamanho=O nome do produto deve ter no máximo {max} caracteres.
produto.categoria.obrigatoria=A categoria do produto é obrigatória.
produto.estoque.atual.obrigatorio=O estoque atual é obrigatório.
produto.estoque.minimo.obrigatorio=O estoque mínimo é obrigatório.
produto.estoque.minimo=O valor deve ser maior ou igual a zero.
produto.estoque.nao.negativo=O valor do estoque não pode ser negativo.
produto.unidade.medida.obrigatoria=A unidade de medida é obrigatória.
produto.unidade.medida.tamanho=A unidade de medida deve ter no máximo {max} caracteres.
produto.unidade.medida.invalida=Unidade de medida inválida. Use valores como unidade, kg, g, litro, pacote, caixa, etc.
